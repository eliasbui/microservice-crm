user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format api_log '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'upstream: $upstream_addr '
                       'response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log api_log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain text/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_status 429;

    # Upstream definitions for all 30 services
    upstream user_auth_service { server 01-user-auth-service:5001; }
    upstream customer_service { server 02-customer-service:5002; }
    upstream contact_service { server 03-contact-service:5003; }
    upstream account_service { server 04-account-service:5004; }
    upstream opportunity_service { server 05-opportunity-service:5005; }
    upstream deal_service { server 06-deal-service:5006; }
    upstream activity_service { server 07-activity-service:5007; }
    upstream interaction_service { server 08-interaction-service:5008; }
    upstream chat_service { server 09-chat-service:5009; }
    upstream ai_service { server 10-ai-service:5010; }
    upstream email_service { server 11-email-service:5011; }
    upstream sms_service { server 12-sms-service:5012; }
    upstream notification_service { server 13-notification-service:5013; }
    upstream sales_pipeline_service { server 14-sales-pipeline-service:5014; }
    upstream proposal_service { server 15-proposal-service:5015; }
    upstream quote_service { server 16-quote-service:5016; }
    upstream campaign_service { server 17-campaign-service:5017; }
    upstream lead_service { server 18-lead-service:5018; }
    upstream analytics_service { server 19-analytics-service:5019; }
    upstream reporting_service { server 20-reporting-service:5020; }
    upstream dashboard_service { server 21-dashboard-service:5021; }
    upstream integration_service { server 22-integration-service:5022; }
    upstream configuration_service { server 23-configuration-service:5023; }
    upstream audit_service { server 24-audit-service:5024; }
    upstream admin_service { server 25-admin-service:5025; }

    server {
        listen 80;
        server_name api.crm.local;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # CORS
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        if ($request_method = 'OPTIONS') { return 204; }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
        }

        # Apply rate limiting
        limit_req zone=api_limit burst=200 nodelay;

        # Core Domain Services
        location /api/v1/auth/ { proxy_pass http://user_auth_service/api/; include /etc/nginx/proxy_params; }
        location /api/v1/customers/ { proxy_pass http://customer_service/api/customers/; include /etc/nginx/proxy_params; }
        location /api/v1/contacts/ { proxy_pass http://contact_service/api/contacts/; include /etc/nginx/proxy_params; }
        location /api/v1/accounts/ { proxy_pass http://account_service/api/accounts/; include /etc/nginx/proxy_params; }
        location /api/v1/opportunities/ { proxy_pass http://opportunity_service/api/opportunities/; include /etc/nginx/proxy_params; }
        location /api/v1/deals/ { proxy_pass http://deal_service/api/deals/; include /etc/nginx/proxy_params; }
        location /api/v1/activities/ { proxy_pass http://activity_service/api/activities/; include /etc/nginx/proxy_params; }
        location /api/v1/interactions/ { proxy_pass http://interaction_service/api/interactions/; include /etc/nginx/proxy_params; }

        # Communication Services
        location /api/v1/chat/ {
            proxy_pass http://chat_service/api/chat/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            include /etc/nginx/proxy_params;
        }
        location /api/v1/ai/ {
            proxy_pass http://ai_service/api/ai/;
            proxy_connect_timeout 120s;
            proxy_read_timeout 120s;
            include /etc/nginx/proxy_params;
        }
        location /api/v1/email/ { proxy_pass http://email_service/api/email/; include /etc/nginx/proxy_params; }
        location /api/v1/sms/ { proxy_pass http://sms_service/api/sms/; include /etc/nginx/proxy_params; }
        location /api/v1/notifications/ { proxy_pass http://notification_service/api/notifications/; include /etc/nginx/proxy_params; }

        # Sales & Marketing Services
        location /api/v1/pipeline/ { proxy_pass http://sales_pipeline_service/api/pipeline/; include /etc/nginx/proxy_params; }
        location /api/v1/proposals/ { proxy_pass http://proposal_service/api/proposals/; include /etc/nginx/proxy_params; }
        location /api/v1/quotes/ { proxy_pass http://quote_service/api/quotes/; include /etc/nginx/proxy_params; }
        location /api/v1/campaigns/ { proxy_pass http://campaign_service/api/campaigns/; include /etc/nginx/proxy_params; }
        location /api/v1/leads/ { proxy_pass http://lead_service/api/leads/; include /etc/nginx/proxy_params; }

        # Analytics Services
        location /api/v1/analytics/ {
            proxy_pass http://analytics_service/api/analytics/;
            proxy_read_timeout 90s;
            include /etc/nginx/proxy_params;
        }
        location /api/v1/reports/ {
            proxy_pass http://reporting_service/api/reports/;
            proxy_read_timeout 90s;
            include /etc/nginx/proxy_params;
        }
        location /api/v1/dashboard/ { proxy_pass http://dashboard_service/api/dashboard/; include /etc/nginx/proxy_params; }

        # Integration Services
        location /api/v1/integrations/ { proxy_pass http://integration_service/api/integrations/; include /etc/nginx/proxy_params; }
        location /api/v1/config/ { proxy_pass http://configuration_service/api/config/; include /etc/nginx/proxy_params; }
        location /api/v1/audit/ { proxy_pass http://audit_service/api/audit/; include /etc/nginx/proxy_params; }
        location /api/v1/admin/ { proxy_pass http://admin_service/api/admin/; include /etc/nginx/proxy_params; }

        # Default route
        location / {
            return 200 '{"service": "CRM API Gateway", "version": "1.0.0", "services": 25}';
            add_header Content-Type application/json;
        }
    }
}

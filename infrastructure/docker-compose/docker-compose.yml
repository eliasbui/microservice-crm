version: '3.8'

services:
  # ==========================================
  # DATABASES & STORAGE
  # ==========================================

  # PostgreSQL Master
  postgres-master:
    image: postgres:16-alpine
    container_name: crm-postgres-master
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_master_data:/var/lib/postgresql/data
      - ../../database/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Master
  redis-master:
    image: redis:7-alpine
    container_name: crm-redis-master
    command: redis-server --requirepass ${REDIS_PASSWORD:-password} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # MESSAGE BROKERS & STREAMING
  # ==========================================

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: crm-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-crm_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/crm}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Zookeeper (for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: crm-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - crm-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: crm-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ==========================================
  # BACKEND MICROSERVICES
  # ==========================================

  # Auth Service (.NET)
  auth-service:
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    container_name: crm-auth-service
    environment:
      POSTGRES_HOST: postgres-master
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_ISSUER: ${JWT_ISSUER:-crm-auth-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-crm-api}
      REDIS_CONFIGURATION: redis-master:6379
      ELASTICSEARCH_HOST: http://elasticsearch:9200
    ports:
      - "5001:5001"
    depends_on:
      - postgres-master
      - redis-master
    networks:
      - crm-network
    restart: unless-stopped

  # CRM Core Service (Java)
  crm-core-service:
    build:
      context: ../../services/crm-core-service
      dockerfile: Dockerfile
    container_name: crm-core-service
    environment:
      POSTGRES_HOST: postgres-master
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-crm_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      - postgres-master
      - redis-master
      - rabbitmq
      - kafka
    networks:
      - crm-network
    restart: unless-stopped

  # Chat & AI Service (Golang)
  chat-ai-service:
    build:
      context: ../../services/chat-ai-service
      dockerfile: Dockerfile
    container_name: crm-chat-ai-service
    environment:
      CHAT_SERVICE_PORT: 8082
      AI_PROVIDER: ${AI_PROVIDER:-claude}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      POSTGRES_HOST: postgres-master
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-crm_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8082:8082"
    depends_on:
      - postgres-master
      - redis-master
      - rabbitmq
      - kafka
    networks:
      - crm-network
    restart: unless-stopped

  # Automation Service (Rust)
  automation-service:
    build:
      context: ../../services/automation-service
      dockerfile: Dockerfile
    container_name: crm-automation-service
    environment:
      AUTOMATION_SERVICE_PORT: 8083
      POSTGRES_HOST: postgres-master
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-crm_db}
      POSTGRES_USER: ${POSTGRES_USER:-crm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    ports:
      - "8083:8083"
    depends_on:
      - postgres-master
      - redis-master
      - rabbitmq
    networks:
      - crm-network
    restart: unless-stopped

  # Notification Service (BUN)
  notification-service:
    build:
      context: ../../services/notification-service
      dockerfile: Dockerfile
    container_name: crm-notification-service
    environment:
      NOTIFICATION_SERVICE_PORT: 8084
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-crm_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-password}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/crm}
    ports:
      - "8084:8084"
    depends_on:
      - rabbitmq
    networks:
      - crm-network
    restart: unless-stopped

  # Integration Service (Golang)
  integration-service:
    build:
      context: ../../services/integration-service
      dockerfile: Dockerfile
    container_name: crm-integration-service
    environment:
      INTEGRATION_SERVICE_PORT: 8086
      REDIS_HOST: redis-master
      REDIS_PORT: 6379
    ports:
      - "8086:8086"
    depends_on:
      - redis-master
    networks:
      - crm-network
    restart: unless-stopped

  # ==========================================
  # API GATEWAY
  # ==========================================

  api-gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: crm-api-gateway
    ports:
      - "8080:80"
    depends_on:
      - auth-service
      - crm-core-service
      - chat-ai-service
      - automation-service
      - notification-service
      - integration-service
    networks:
      - crm-network
    restart: unless-stopped

  # ==========================================
  # MONITORING & LOGGING
  # ==========================================

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: crm-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: crm-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: crm-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - crm-network
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: crm-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - crm-network
    restart: unless-stopped

# ==========================================
# NETWORKS
# ==========================================

networks:
  crm-network:
    driver: bridge

# ==========================================
# VOLUMES
# ==========================================

volumes:
  postgres_master_data:
  redis_data:
  rabbitmq_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:

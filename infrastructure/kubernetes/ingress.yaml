apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crm-ingress
  namespace: crm-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - crm.yourdomain.com
    - api.crm.yourdomain.com
    secretName: crm-tls-secret
  rules:
  - host: api.crm.yourdomain.com
    http:
      paths:
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 5001
      - path: /api/customers
        pathType: Prefix
        backend:
          service:
            name: crm-core-service
            port:
              number: 8081
      - path: /api/opportunities
        pathType: Prefix
        backend:
          service:
            name: crm-core-service
            port:
              number: 8081
      - path: /api/chat
        pathType: Prefix
        backend:
          service:
            name: chat-ai-service
            port:
              number: 8082
      - path: /api/ai
        pathType: Prefix
        backend:
          service:
            name: chat-ai-service
            port:
              number: 8082
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: chat-ai-service
            port:
              number: 8082
      - path: /api/workflows
        pathType: Prefix
        backend:
          service:
            name: automation-service
            port:
              number: 8083
      - path: /api/notifications
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port:
              number: 8084
      - path: /api/integrations
        pathType: Prefix
        backend:
          service:
            name: integration-service
            port:
              number: 8086
  - host: crm.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000

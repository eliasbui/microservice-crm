name: CI - Build and Test

on:
  push:
    branches: [ main, develop, claude/** ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build Auth Service (.NET)
  build-auth-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./services/auth-service

      - name: Build
        run: dotnet build --no-restore
        working-directory: ./services/auth-service

      - name: Test
        run: dotnet test --no-build --verbosity normal
        working-directory: ./services/auth-service

  # Build CRM Core Service (Java)
  build-crm-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build with Gradle
        run: ./gradlew build
        working-directory: ./services/crm-core-service

      - name: Run tests
        run: ./gradlew test
        working-directory: ./services/crm-core-service

  # Build Chat & AI Service (Go)
  build-chat-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build -v ./...
        working-directory: ./services/chat-ai-service

      - name: Test
        run: go test -v ./...
        working-directory: ./services/chat-ai-service

  # Build Automation Service (Rust)
  build-automation-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build
        run: cargo build --release
        working-directory: ./services/automation-service

      - name: Test
        run: cargo test
        working-directory: ./services/automation-service

  # Build Notification Service (BUN)
  build-notification-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: ./services/notification-service

      - name: Build
        run: bun run build || true
        working-directory: ./services/notification-service

  # Build Integration Service (Go)
  build-integration-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build -v ./...
        working-directory: ./services/integration-service

  # Build Frontend (Next.js)
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/crm-web-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend/crm-web-app

      - name: Type check
        run: npm run type-check
        working-directory: ./frontend/crm-web-app

      - name: Build
        run: npm run build
        working-directory: ./frontend/crm-web-app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

  # Docker build test
  docker-build-test:
    runs-on: ubuntu-latest
    needs: [build-auth-service, build-crm-core, build-chat-service, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Auth Service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          push: false
          tags: crm-auth-service:test

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/crm-web-app
          push: false
          tags: crm-frontend:test
